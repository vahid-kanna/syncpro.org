<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Marks the document as JS-capable before first paint. The scroll-reveal
      styles are scoped to `.js`, so if scripting is unavailable or fails, no
      content is ever hidden. Inline and synchronous on purpose: adding this
      class later would cause a visible flash of already-revealed content.
    -->
    <script>
      document.documentElement.classList.add("js");
    </script>

    <!-- Favicons & app icons -->
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />

    <!-- Matches --bg-base in the design system, not pure black -->
    <meta name="theme-color" content="#0C0E11" />
    <meta name="color-scheme" content="dark" />

    <title>SyncPro — AI Project Controls for Construction Schedules</title>
    <meta name="application-name" content="SyncPro" />
    <meta name="apple-mobile-web-app-title" content="SyncPro" />
    <meta
      name="description"
      content="SyncPro turns a Primavera P6 file into a project knowledge graph, resolves site language to the right CPM activity, and commits a schedule update only when independent evidence agrees."
    />
    <meta name="author" content="SyncPro" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://syncpro.org/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SyncPro" />
    <meta property="og:url" content="https://syncpro.org/" />
    <meta property="og:title" content="SyncPro — The AI Project Controls Engineer for Construction" />
    <meta
      property="og:description"
      content="Earn the right to update the schedule. Graph-grounded activity resolution, evidence-corroborated commits, and a tamper-evident audit trail for every change."
    />
    <meta property="og:image" content="https://syncpro.org/logo.png" />
    <meta property="og:image:alt" content="SyncPro — AI project controls for construction schedules" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SyncPro — The AI Project Controls Engineer for Construction" />
    <meta
      name="twitter:description"
      content="Earn the right to update the schedule. Graph-grounded activity resolution, evidence-corroborated commits, and a tamper-evident audit trail for every change."
    />
    <meta name="twitter:image" content="https://syncpro.org/logo.png" />

    <!--
      Structured data: entity + product.
      FAQPage is injected at runtime from src/site/lib/content.ts so the schema
      and the visible copy can never drift apart.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://syncpro.org/#organization",
            "name": "SyncPro",
            "alternateName": ["SyncPro", "SyncPro AI", "SyncPro Schedule Intelligence"],
            "url": "https://syncpro.org/",
            "sameAs": ["https://github.com/vahid-kanna"],
            "logo": {
              "@type": "ImageObject",
              "url": "https://syncpro.org/logo.png",
              "width": 512,
              "height": 512
            },
            "description": "SyncPro builds an AI project controls engineer that earns the right to update a construction schedule.",
            "disambiguatingDescription": "SyncPro (syncpro.org) is a construction schedule intelligence platform that parses Oracle Primavera P6 baselines and grounds field claims in a project knowledge graph. It is not affiliated with any smart-home, IoT hardware, or wallet-syncing product of a similar name.",
            "email": "founders@syncpro.org",
            "foundingLocation": {
              "@type": "Place",
              "name": "IIT Madras, Chennai, India"
            },
            "knowsAbout": [
              "Construction Project Controls",
              "Critical Path Method (CPM)",
              "Oracle Primavera P6",
              "DCMA 14-Point Assessment",
              "Schedule Delay Analysis",
              "Forensic Delay and Evidence Graphs"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://syncpro.org/#website",
            "url": "https://syncpro.org/",
            "name": "SyncPro",
            "description": "The AI project controls engineer for schedule-intensive, dispute-prone delivery.",
            "publisher": { "@id": "https://syncpro.org/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://syncpro.org/#software",
            "name": "SyncPro Schedule Intelligence",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web, Cloud",
            "url": "https://syncpro.org/",
            "description": "Scores, repairs and re-forecasts a Primavera P6 schedule, resolves field claims to the correct CPM activity through a project knowledge graph, and commits updates under a confidence gate with a tamper-evident audit trail.",
            "creator": { "@id": "https://syncpro.org/#organization" },
            "featureList": [
              "DCMA 14-point schedule health assessment",
              "Graph-grounded field-claim resolution",
              "Confidence-gated schedule updates",
              "Append-only forensic event log"
            ]
          }
        ]
      }
    </script>

    <!-- Typography: Geist + Geist Mono (matches the product design system) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <noscript>
        <h1>SyncPro — the AI project controls engineer</h1>
        <p>
          SyncPro reads a Primavera P6 file into a project knowledge graph, resolves messy site
          language to the correct CPM activity, and commits a schedule update only when independent
          evidence agrees. Every change carries its citation. Request a free pilot audit at
          founders@syncpro.org.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
